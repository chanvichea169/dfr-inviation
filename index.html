<!doctype html>
<html lang="km" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Application Meta -->
    <title>ប្រព័ន្ធគ្រប់គ្រងការអនុញ្ញាតច្បាប់ · នាយកដ្ឋានមុខងារ និងធនធាន</title>
    <meta
      name="description"
      content="ប្រព័ន្ធគ្រប់គ្រង និងស្នើសុំច្បាប់ឈប់សម្រាកឌីជីថល នៃនាយកដ្ឋានមុខងារ និងធនធាន — សម្រួលដំណើរការស្នើសុំ ពិនិត្យ និងអនុម័តច្បាប់ប្រកបដោយប្រសិទ្ធភាព។"
    />
    <meta name="author" content="នាយកដ្ឋានមុខងារ និងធនធាន" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Dynamic Theme Color Sync -->
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ប្រព័ន្ធគ្រប់គ្រងការអនុញ្ញាតច្បាប់ · នាយកដ្ឋានមុខងារ និងធនធាន"
    />
    <meta
      property="og:description"
      content="ប្រព័ន្ធគ្រប់គ្រង និងស្នើសុំច្បាប់ឈប់សម្រាកឌីជីថល — ងាយស្រួល លឿនរហ័ស និងមានតម្លាភាព។"
    />
    <meta property="og:image" content="/og-cover.jpg" />

    <!-- Web Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-light: #f8fafc;
        --bg-dark: #0f172a;
      }

      body {
        font-family:
          "Kantumruy Pro",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg-light);
        color: #1e293b;
        margin: 0;
        overflow-x: hidden;
        transition: background-color 0.3s ease;
      }

      .dark body {
        background-color: var(--bg-dark);
        color: #f8fafc;
      }

      /* Ambient canvas fixed strictly to viewport background */
      #ambient-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
      }

      /* Application Mounting Surface */
      #root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }
    </style>

    <!-- Theme Initialization -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var supportDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (saved === "dark" || (!saved && supportDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Interactive Background Canvas Layer -->
    <canvas id="ambient-canvas"></canvas>

    <!-- React Root Element -->
    <div id="root"></div>

    <!-- Canvas Animation Component -->
    <script>
      (function () {
        const canvas = document.getElementById("ambient-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        // Palette tuned for modern administrative dashboard visuals
        const lightColors = [
          "rgba(59, 130, 246, ", // Primary Blue
          "rgba(99, 102, 241, ", // Indigo
          "rgba(20, 184, 166, ", // Teal
          "rgba(139, 92, 246, ", // Accent Purple
        ];

        const symbols = ["ច្បាប់", "អនុញ្ញាត", "ស្នើ", "ធនធាន", "✓", "✦", "📋"];
        let nodes = [];
        const NODE_COUNT = 28;

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          initNodes();
        }

        function initNodes() {
          nodes = [];
          for (let i = 0; i < NODE_COUNT; i++) {
            nodes.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              radius: Math.random() * 10 + 12,
              color:
                lightColors[Math.floor(Math.random() * lightColors.length)],
              symbol: symbols[Math.floor(Math.random() * symbols.length)],
              alpha: Math.random() * 0.35 + 0.15,
              vy: -(Math.random() * 0.3 + 0.1), // Gentle floating upward movement
              vx: (Math.random() - 0.5) * 0.2,
              pulseSpeed: Math.random() * 0.01 + 0.003,
              pulseDirection: Math.random() > 0.5 ? 1 : -1,
            });
          }
        }

        function drawNode(node) {
          ctx.save();

          // Render glowing dot
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
          ctx.fillStyle = node.color + node.alpha + ")";
          ctx.shadowColor = node.color + "0.4)";
          ctx.shadowBlur = 12;
          ctx.fill();

          // Render centered micro typography / symbol
          ctx.font = `500 ${Math.floor(node.radius * 0.65)}px 'Kantumruy Pro', sans-serif`;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(node.alpha + 0.3, 0.9)})`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(node.symbol, node.x, node.y);

          ctx.restore();
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          nodes.forEach((node) => {
            // Motion updates
            node.y += node.vy;
            node.x += node.vx;

            // Reset loop position when out of viewport
            if (node.y < -20) {
              node.y = canvas.height + 20;
              node.x = Math.random() * canvas.width;
            }
            if (node.x < -20 || node.x > canvas.width + 20) {
              node.vx *= -1;
            }

            // Opacity pulsing
            node.alpha += node.pulseSpeed * node.pulseDirection;
            if (node.alpha >= 0.5) node.pulseDirection = -1;
            if (node.alpha <= 0.12) node.pulseDirection = 1;

            drawNode(node);
          });

          requestAnimationFrame(animate);
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        animate();
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
